<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luo Lasku</title>
    <script>
    // Estää iPhonen välimuistibugin "takaisin"-nappia käytettäessä
    window.addEventListener("pageshow", function(event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4 font-sans pb-10">

    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
       
        <!-- Yläpalkki ja navigointi -->
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-6 gap-4">
            <h1 class="text-2xl font-bold text-gray-800">Luo lasku</h1>
            
            <div class="flex gap-3 items-center flex-wrap">
                <a href="laskutus.html" class="text-sm text-blue-600 font-medium hover:underline">Lasku</a>
                <span class="text-gray-300 hidden sm:inline">|</span>
                
                <a href="kuitti.html" class="text-sm text-blue-600 font-medium hover:underline">Kuitti</a>
                <span class="text-gray-300 hidden sm:inline">|</span>
                
                <a href="arkisto.html" class="text-sm text-blue-600 font-medium hover:underline">Arkisto</a>
                <span class="text-gray-300 hidden sm:inline">|</span>
                
                <a href="omat_tiedot.html" class="text-sm text-blue-600 font-medium hover:underline">Omat tiedot</a>
                <span class="text-gray-300 hidden sm:inline">|</span>
                
                <a href="asiakkaat.html" class="text-sm text-blue-600 font-medium hover:underline">Asiakkaat</a>
                <span class="text-gray-300 hidden sm:inline">|</span>
                
                <button id="kirjauduUlosBtn" class="text-sm text-red-500 font-medium hover:underline outline-none">Kirjaudu ulos</button>
            </div>
        </div>
        
        <div class="space-y-6">
            <!-- Laskun perustiedot -->
            <div class="p-4 bg-gray-50 rounded-xl border border-gray-100 space-y-4 shadow-sm w-full">
                <h2 class="text-xs font-bold text-blue-600 uppercase tracking-wider">Laskun perustiedot</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Laskun numero</label>
                        <input type="number" id="laskun_numero" value="1001" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 font-bold text-gray-800 block">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Eräpäivä</label>
                        <div class="flex w-full bg-[#FDF8EE] border border-gray-300 rounded-lg overflow-hidden focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
                            <input type="date" id="erapaiva" class="w-full min-w-0 bg-transparent px-3 py-2.5 outline-none border-0 appearance-none">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Omat tiedot -->
            <div class="p-4 bg-gray-50 rounded-xl border border-gray-100 space-y-4">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Omat tiedot (Laskuttaja)</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nimi / Yritys</label>
                    <input type="text" id="laskuttaja" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Ladataan...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Katuosoite ja postitoimipaikka</label>
                    <input type="text" id="laskuttaja_osoite" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Esim. Esimerkkitie 1, 00100 Helsinki">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Y-tunnus</label>
                        <input type="text" id="laskuttaja_ytunnus" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="1234567-8">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">IBAN-tilinumero</label>
                        <input type="text" id="iban" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="FI00...">
                    </div>
                </div>
            </div>

            <!-- Asiakkaan tiedot -->
            <div class="p-4 bg-gray-50 rounded-xl border border-gray-100 space-y-4">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Asiakkaan tiedot</h2>
                
                <div class="pb-3 border-b border-gray-200">
                    <label class="block text-sm font-medium text-blue-600 mb-1">Valitse tallennettu asiakas</label>
                    <select id="asiakas_valinta" class="w-full bg-white border border-blue-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-gray-700">
                        <option value="">-- Kirjoita tiedot käsin tai valitse --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Asiakkaan nimi</label>
                    <input type="text" id="asiakas" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Matti Meikäläinen">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Katuosoite ja postitoimipaikka</label>
                    <input type="text" id="asiakas_osoite" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Esim. Esimerkkitie 1, 00100 Helsinki">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Asiakkaan Y-tunnus</label>
                    <input type="text" id="asiakas_ytunnus" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="9876543-2">
                </div>
            </div>

            <!-- Laskutettava työ -->
            <div class="p-4 bg-gray-50 rounded-xl border border-gray-100 space-y-4">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Laskutettava työ</h2>
                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Työn pvm</label>
                        <div class="flex w-full bg-[#FDF8EE] border border-gray-300 rounded-lg overflow-hidden focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
                            <input type="date" id="tyo_pvm" class="w-full min-w-0 bg-transparent px-3 py-2.5 outline-none border-0 appearance-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Kuvaus</label>
                        <input type="text" id="kuvaus" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Esim. Ikkunoiden pesu">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Veroton hinta (€)</label>
                        <input type="number" id="hinta" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="150">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ALV %</label>
                        <select id="alv_prosentti" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                            <option value="25.5">25,5 %</option>
                            <option value="13.5">13,5 %</option>
                            <option value="10">10 %</option>
                            <option value="0">0 %</option>
                        </select>
                    </div>
                </div>
            </div>

            <button id="luoPdfBtn" class="w-full bg-blue-600 text-white font-bold text-lg rounded-xl p-4 mt-2 hover:bg-blue-700 active:bg-blue-800 transition shadow-md">
                Luo PDF ja lataa
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center mt-8 mb-4 text-xs text-gray-500">
        <img src="./lasquitos logo.png" alt="logo" style="display: block; margin: 0 auto; width: 50%;">
        <a href="tietosuoja.html" class="hover:text-blue-600 hover:underline transition">Tietosuojalauseke</a>
        <p class="mt-1">&copy; OK AV 2026</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, getDoc, doc, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // --- LISÄÄ OMA FIREBASE CONFIG TÄHÄN ---
        const firebaseConfig = {

  apiKey: "AIzaSyCLV33Uqrue9BnvnSHEHSxlm6metKkpC5w",

  authDomain: "laskutin-bdba4.firebaseapp.com",

  projectId: "laskutin-bdba4",

  storageBucket: "laskutin-bdba4.firebasestorage.app",

  messagingSenderId: "1042914066308",

  appId: "1:1042914066308:web:5c7b6dc27579203c9da7d1"

};

        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUid = null;
        let asiakasDataLista = [];

        // 1. TARKISTETAAN KIRJAUTUMINEN
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUid = user.uid;
                await lataaOmatTiedot();
                await lataaAsiakkaatValikkoon();
            } else {
                window.location.href = "kirjautuminen.html"; // Ohjaus kirjautumiseen
            }
        });

        // 2. ULOSKIRJAUTUMINEN
        document.getElementById('kirjauduUlosBtn').addEventListener('click', () => {
            signOut(auth);
        });

        async function lataaOmatTiedot() {
            try {
                const userDoc = await getDoc(doc(db, "users", currentUid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    if (data.nimi) document.getElementById('laskuttaja').value = data.nimi;
                    if (data.osoite) document.getElementById('laskuttaja_osoite').value = data.osoite;
                    if (data.ytunnus) document.getElementById('laskuttaja_ytunnus').value = data.ytunnus;
                    if (data.iban) document.getElementById('iban').value = data.iban;
                }
            } catch (error) {
                console.error("Ei voitu ladata omia tietoja:", error);
            }
        }

        async function lataaAsiakkaatValikkoon() {
            try {
                const q = query(collection(db, "customers"), where("uid", "==", currentUid));
                const snapshot = await getDocs(q);
                const valikko = document.getElementById('asiakas_valinta');
                
                snapshot.forEach(dokumentti => {
                    const data = dokumentti.data();
                    asiakasDataLista.push(data);
                    const opt = document.createElement('option');
                    opt.value = asiakasDataLista.length - 1; 
                    opt.text = data.nimi;
                    valikko.appendChild(opt);
                });
            } catch (error) {
                console.error("Asiakkaiden haku epäonnistui:", error);
            }
        }

        document.getElementById('asiakas_valinta').addEventListener('change', (e) => {
            const indeksi = e.target.value;
            if (indeksi !== "") {
                const valittu = asiakasDataLista[indeksi];
                document.getElementById('asiakas').value = valittu.nimi || "";
                document.getElementById('asiakas_osoite').value = valittu.osoite || "";
                document.getElementById('asiakas_ytunnus').value = valittu.ytunnus || "";
            } else {
                document.getElementById('asiakas').value = "";
                document.getElementById('asiakas_osoite').value = "";
                document.getElementById('asiakas_ytunnus').value = "";
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const due = new Date(today);
            due.setDate(due.getDate() + 14); 
            const formatDateForInput = (date) => date.toISOString().split('T')[0];
            document.getElementById('tyo_pvm').value = formatDateForInput(today);
            document.getElementById('erapaiva').value = formatDateForInput(due);
        });

        // LASKUN LUONTI JA TALLENNUS FIRESTOREEN
        document.getElementById('luoPdfBtn').addEventListener('click', async () => {
            
            const pdfBtn = document.getElementById('luoPdfBtn');
            
            // Validointi
            const l_yt_input = document.getElementById('laskuttaja_ytunnus').value.trim();
            const a_yt_input = document.getElementById('asiakas_ytunnus').value.trim();
            const syotetty_iban = document.getElementById('iban').value.trim();
            const ytRegex = /^\d{7}-\d$/;

            if (l_yt_input && !ytRegex.test(l_yt_input)) {
                alert("Laskuttajan Y-tunnus on virheellinen.\nOikea muoto on esim. 1234567-8");
                return;
            }
            if (a_yt_input && !ytRegex.test(a_yt_input)) {
                alert("Asiakkaan Y-tunnus on virheellinen.\nOikea muoto on esim. 1234567-8");
                return;
            }

            let puhdasIban = "";
            if (syotetty_iban) {
                puhdasIban = syotetty_iban.replace(/\s+/g, '').toUpperCase();
                if (!/^FI\d{16}$/.test(puhdasIban)) {
                    alert("IBAN-tilinumero on virheellinen.\nSuomalainen IBAN alkaa 'FI' ja sisältää 16 numeroa.");
                    return;
                }
                puhdasIban = puhdasIban.match(/.{1,4}/g).join(' ');
            }

            pdfBtn.innerText = "Tallennetaan arkistoon...";
            pdfBtn.disabled = true;

            const muotoilePvm = (dateString) => {
                if (!dateString) return "";
                const [year, month, day] = dateString.split('-');
                return `${day}.${month}.${year}`;
            };
            const nykyPvm = () => {
                const d = new Date();
                return `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`;
            };

            const laskun_numero = document.getElementById('laskun_numero').value || '1001';
            
            // Viitenumero
            const satunnainen = Math.floor(1000 + Math.random() * 9000); 
            const runko = String(laskun_numero) + String(satunnainen);
            const kertoimet = [7, 3, 1];
            let summa = 0;
            for (let i = runko.length - 1, j = 0; i >= 0; i--, j++) {
                summa += parseInt(runko[i], 10) * kertoimet[j % 3];
            }
            const tarkistus = (10 - (summa % 10)) % 10;
            const viitenumero = (runko + String(tarkistus)).split('').reverse().join('').replace(/(.{5})/g, '$1 ').split('').reverse().join('').trim();

            const laskuttaja = document.getElementById('laskuttaja').value || 'Oma Nimi';
            const laskuttaja_osoite = document.getElementById('laskuttaja_osoite').value;
            const iban = puhdasIban || 'Ei ilmoitettu';
            
            const asiakas = document.getElementById('asiakas').value || 'Tuntematon asiakas';
            const asiakas_osoite = document.getElementById('asiakas_osoite').value;
            
            const erapaivaInput = document.getElementById('erapaiva').value;
            const erapaiva = muotoilePvm(erapaivaInput);
            const tyo_pvmInput = document.getElementById('tyo_pvm').value;
            const tyo_pvm = muotoilePvm(tyo_pvmInput);
            const kuvaus = document.getElementById('kuvaus').value || 'Ei kuvausta';
            
            const hinta = parseFloat(document.getElementById('hinta').value || 0);
            const alvValintaStr = document.getElementById('alv_prosentti').value;
            const alv = hinta * (parseFloat(alvValintaStr) / 100); 
            const yhteensa = hinta + alv;
            const muotoileSumma = (s) => s.toFixed(2).replace('.', ',') + ' EUR';

            // --- 1. TALLENNUS FIRESTOREEN ('invoices' kokoelma) ---
            try {
                await addDoc(collection(db, "invoices"), {
                    uid: currentUid,
                    laskuNro: Number(laskun_numero),
                    viitenumero: viitenumero,
                    asiakas: asiakas,
                    asiakasOsoite: asiakas_osoite,
                    asiakasYtunnus: a_yt_input,
                    tyoPvm: tyo_pvmInput, // YYYY-MM-DD formaatti on tietokannassa parempi lajitella
                    erapaiva: erapaivaInput, 
                    kuvaus: kuvaus,
                    verotonHinta: hinta,
                    alvProsentti: Number(alvValintaStr),
                    alvSumma: alv,
                    yhteensa: yhteensa,
                    luotuPvm: new Date(),
                    status: 'avoin' // Maksettu / Erääntynyt jne. lisätään myöhemmin arkistonäkymässä
                });
            } catch (error) {
                console.error("Virhe laskun tallennuksessa Firestoreen:", error);
                alert("Laskua ei saatu tallennettua pilviarkistoon, mutta PDF ladataan laitteellesi normaalisti.");
            }

            // --- 2. PDF PIIRTO ---
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

            doc.setFontSize(24);
            doc.setTextColor(37, 99, 235);
            doc.setFont("helvetica", "bold");
            doc.text("LASKU", 20, 30);

            doc.setFontSize(10);
            doc.setTextColor(0, 0, 0);
            doc.setFont("helvetica", "normal");
            doc.text(`Pvm: ${nykyPvm()}`, 190, 23, { align: "right" });
            doc.text(`Laskun nro: ${laskun_numero}`, 190, 29, { align: "right" });
            doc.text(`Erapaiva: ${erapaiva}`, 190, 35, { align: "right" });

            doc.setDrawColor(37, 99, 235);
            doc.setLineWidth(0.5);
            doc.line(20, 42, 190, 42);

            doc.setFontSize(9);
            doc.setTextColor(107, 114, 128);
            doc.setFont("helvetica", "bold");
            doc.text("LASKUTTAJA", 20, 52);
            doc.text("ASIAKAS", 105, 52);

            doc.setFontSize(11);
            doc.setTextColor(17, 24, 39);
            
            let lY = 58;
            doc.text(laskuttaja, 20, lY);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            if (laskuttaja_osoite) { lY += 5; doc.text(laskuttaja_osoite, 20, lY); }
            if (l_yt_input) { lY += 5; doc.text(`Y-tunnus: ${l_yt_input}`, 20, lY); }

            let aY = 58;
            doc.setFontSize(11);
            doc.setFont("helvetica", "bold");
            doc.text(asiakas, 105, aY);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            if (asiakas_osoite) { aY += 5; doc.text(asiakas_osoite, 105, aY); }
            if (a_yt_input) { aY += 5; doc.text(`Y-tunnus: ${a_yt_input}`, 105, aY); }

            doc.setFillColor(243, 244, 246);
            doc.rect(20, 82, 170, 10, "F");
            doc.setFont("helvetica", "bold");
            doc.text("Pvm", 23, 89);
            doc.text("Kuvaus", 50, 89);
            doc.text("Veroton hinta", 187, 89, { align: "right" });

            doc.setFont("helvetica", "normal");
            if (tyo_pvm) doc.text(tyo_pvm, 23, 100);
            doc.text(kuvaus, 50, 100);
            doc.text(muotoileSumma(hinta), 187, 100, { align: "right" });
            
            doc.setDrawColor(229, 231, 235);
            doc.line(20, 106, 190, 106);

            doc.setFontSize(11);
            doc.text(`ALV (${alvValintaStr.replace('.', ',')} %):`, 130, 118);
            doc.text(muotoileSumma(alv), 187, 118, { align: "right" });

            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("Yhteensa:", 130, 128);
            doc.text(muotoileSumma(yhteensa), 187, 128, { align: "right" });
            
            doc.setDrawColor(37, 99, 235);
            doc.line(130, 132, 190, 132);

            doc.setDrawColor(229, 231, 235);
            doc.line(20, 270, 190, 270);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(107, 114, 128);
            doc.text(`Saaja: ${laskuttaja}`, 20, 277);
            doc.text(`IBAN: ${iban}`, 20, 282);
            
            doc.setFont("helvetica", "bold");
            doc.text(`Viitenumero: ${viitenumero}`, 190, 282, { align: "right" });

            const tiedostonimi = 'Lasku_' + asiakas.replace(/\s+/g, '_') + '.pdf';
            doc.save(tiedostonimi);

            // Palauta nappi ennalleen
            pdfBtn.innerText = "Luo PDF ja lataa";
            pdfBtn.disabled = false;
        });
    </script>
</body>
</html>
